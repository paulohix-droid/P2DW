<section id="cesta" class="py-5 text-light">
  <div class="container">
    <h2 class="mb-4 border-bottom border-dark pb-3">
      <i class="fa-solid fa-basket-shopping text-info me-2"></i> Sua Cesta
    </h2>

    <div *ngIf="mensagemSucesso" class="alert alert-success">
      {{ mensagemSucesso }}
    </div>
    <div *ngIf="mensagemErro" class="alert alert-danger">
      {{ mensagemErro }}
    </div>

    <div class="table-responsive rounded border border-dark mb-4 bg-dark">
      <table class="table table-dark table-hover align-middle m-0">
        <thead>
          <tr class="text-secondary">
            <th scope="col" class="ps-4">PRODUTO</th>
            <th scope="col" class="text-center">QTD</th>
            <th scope="col" class="text-end pe-4">VALOR</th>
            <th scope="col" class="text-center" style="width: 80px;">AÇÃO</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of itens; let i = index">
            <td class="ps-4 py-3">
              <div class="d-flex align-items-center gap-3">
                <img
                  [src]="item.imagem || '/logo.png'"
                  class="rounded object-fit-cover"
                  width="60"
                  height="60"
                  [alt]="item.nome"
                >
                <span class="fw-semibold">{{ item.nome }}</span>
              </div>
            </td>
            <td class="text-center">1x</td>
            <td class="text-end text-info fw-bold pe-4">R$ {{ item.valor | number:'1.2-2' }}</td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-danger" (click)="removerItem(i)" title="Remover item">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="itens.length === 0">
            <td colspan="4" class="text-center py-4 text-secondary">
              Sua cesta está vazia. <a routerLink="/" class="text-info">Clique aqui para ver guitarras</a>
            </td>
          </tr>
        </tbody>
        <tfoot class="bg-black" *ngIf="itens.length > 0">
          <tr class="fs-4">
            <td colspan="2" class="text-end text-secondary fw-bold border-0 py-4">TOTAL</td>
            <td class="text-end text-info fw-bold pe-4 border-0 py-4">R$ {{ calcularTotal() | number:'1.2-2' }}</td>
            <td class="border-0"></td>
          </tr>
        </tfoot>
      </table>
    </div>

    <div class="d-flex justify-content-between align-items-center" *ngIf="itens.length > 0">
      <button class="btn btn-outline-danger px-4" (click)="limparCesta()">Limpar Cesta</button>
      <button class="btn btn-info btn-lg px-5 fw-bold" (click)="finalizarCompra()">FINALIZAR COMPRA</button>
    </div>
  </div>
</section>
